<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Kayıt Ol</title></head>
<body>
<main layout:fragment="content">
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="auth-card">
                        <div class="text-center mb-4">
                            <h2 class="auth-title"><i class="bi bi-house-heart-fill text-primary"></i></h2>
                            <h3>Kayıt Ol</h3>
                            <p class="text-muted">Hemen ücretsiz hesap oluşturun</p>
                        </div>
                        <div class="alert alert-danger d-none" id="registerError"></div>
                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Ad</label>
                                    <input type="text" class="form-control" id="regFirstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Soyad</label>
                                    <input type="text" class="form-control" id="regLastName" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-posta</label>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefon</label>
                                <input type="tel" class="form-control" id="regPhone">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Şifre</label>
                                <input type="password" class="form-control" id="regPassword" minlength="6" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hesap Türü</label>
                                <select class="form-select" id="regRole">
                                    <option value="TENANT">Kiracı (Misafir)</option>
                                    <option value="OWNER">Ev Sahibi</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                <i class="bi bi-person-plus"></i> Kayıt Ol
                            </button>
                        </form>
                        <hr>
                        <p class="text-center mb-0">
                            Zaten hesabınız var mı? <a th:href="@{/login}" class="text-primary fw-bold">Giriş Yap</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<script layout:fragment="scripts">
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorEl = document.getElementById('registerError');
    errorEl.classList.add('d-none');
    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                phoneNumber: document.getElementById('regPhone').value,
                role: document.getElementById('regRole').value
            })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('accessToken', data.data.accessToken);
            localStorage.setItem('refreshToken', data.data.refreshToken);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            document.cookie = `accessToken=${data.data.accessToken}; path=/; max-age=${data.data.expiresIn / 1000}`;
            const role = data.data.user.role;
            if (role === 'ADMIN') window.location.href = '/admin/dashboard';
            else if (role === 'OWNER') window.location.href = '/owner/dashboard';
            else window.location.href = '/';
        } else {
            errorEl.textContent = data.message;
            errorEl.classList.remove('d-none');
        }
    } catch (err) {
        errorEl.textContent = 'Bir hata oluştu. Lütfen tekrar deneyin.';
        errorEl.classList.remove('d-none');
    }
});
</script>
</body>
</html>
