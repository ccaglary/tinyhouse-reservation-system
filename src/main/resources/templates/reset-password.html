<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Şifre Sıfırla</title></head>
<body><main layout:fragment="content">
    <section class="auth-section"><div class="container"><div class="row justify-content-center"><div class="col-md-5"><div class="auth-card text-center">
        <h3>Şifre Sıfırla</h3><p class="text-muted mb-4">Yeni şifrenizi belirleyin.</p>
        <form id="rpForm"><div class="mb-3"><input type="password" class="form-control" id="rpPassword" placeholder="Yeni şifre" required minlength="6"></div>
            <button type="submit" class="btn btn-primary w-100">Şifreyi Sıfırla</button></form>
    </div></div></div></div></section>
</main>
<script layout:fragment="scripts">
document.getElementById('rpForm').addEventListener('submit',async function(e){e.preventDefault();
const params=new URLSearchParams(window.location.search);const token=params.get('token');
const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,newPassword:document.getElementById('rpPassword').value})});
const d=await r.json();if(d.success){showToast('Şifre sıfırlandı!','success');setTimeout(()=>location.href='/login',1500);}else showToast(d.message,'danger');});
</script></body></html>
