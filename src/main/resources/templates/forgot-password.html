<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Şifremi Unuttum</title></head>
<body><main layout:fragment="content">
    <section class="auth-section"><div class="container"><div class="row justify-content-center"><div class="col-md-5"><div class="auth-card text-center">
        <h3>Şifremi Unuttum</h3><p class="text-muted mb-4">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
        <div class="alert alert-success d-none" id="fpSuccess"></div><div class="alert alert-danger d-none" id="fpError"></div>
        <form id="fpForm"><div class="mb-3"><input type="email" class="form-control" id="fpEmail" placeholder="E-posta adresiniz" required></div>
            <button type="submit" class="btn btn-primary w-100">Gönder</button></form>
        <hr><a th:href="@{/login}">Giriş Yap</a>
    </div></div></div></div></section>
</main>
<script layout:fragment="scripts">
document.getElementById('fpForm').addEventListener('submit',async function(e){e.preventDefault();
const r=await fetch('/api/auth/forgot-password?email='+encodeURIComponent(document.getElementById('fpEmail').value),{method:'POST'});
const d=await r.json();
if(d.success){document.getElementById('fpSuccess').textContent='E-posta gönderildi!';document.getElementById('fpSuccess').classList.remove('d-none');}
else{document.getElementById('fpError').textContent=d.message;document.getElementById('fpError').classList.remove('d-none');}});
</script></body></html>
