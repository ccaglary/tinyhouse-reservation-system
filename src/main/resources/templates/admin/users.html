<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Admin - Kullanıcılar</title></head>
<body>
<main layout:fragment="content">
    <div class="dashboard-wrapper"><div class="container-fluid"><div class="row">
        <nav class="col-md-2 sidebar">
            <div class="sidebar-header"><h5><i class="bi bi-shield-check"></i> Admin</h5></div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/users"><i class="bi bi-people"></i> Kullanıcılar</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/reservations"><i class="bi bi-calendar-check"></i> Rezervasyonlar</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/tinyhouses"><i class="bi bi-house"></i> Tiny House'lar</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/reports"><i class="bi bi-graph-up"></i> Raporlar</a></li>
            </ul>
        </nav>
        <div class="col-md-10 dashboard-content">
            <div class="d-flex justify-content-between mb-4">
                <h3>Kullanıcı Yönetimi</h3>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" id="userSearch" placeholder="Ara..." style="width:250px">
                    <select class="form-select" id="userRole" style="width:150px"><option value="">Tüm Roller</option><option value="ADMIN">Admin</option><option value="OWNER">Owner</option><option value="TENANT">Tenant</option></select>
                </div>
            </div>
            <div class="card"><div class="card-body"><div class="table-responsive"><table class="table table-hover">
                <thead><tr><th>ID</th><th>Ad Soyad</th><th>E-posta</th><th>Rol</th><th>Durum</th><th>İşlem</th></tr></thead>
                <tbody id="usersTable"></tbody>
            </table></div></div></div>
        </div>
    </div></div></div>
</main>
<script layout:fragment="scripts">
async function loadUsers() {
    const token = localStorage.getItem('accessToken');
    const search = document.getElementById('userSearch').value;
    const role = document.getElementById('userRole').value;
    let url = '/api/admin/users?size=20';
    if (search) url += '&search=' + encodeURIComponent(search);
    if (role) url += '&role=' + role;
    const res = await fetch(url, {headers:{'Authorization':'Bearer '+token}});
    const data = await res.json();
    if (!data.success) return;
    document.getElementById('usersTable').innerHTML = data.data.content.map(u => `
        <tr><td>${u.id}</td><td>${u.firstName} ${u.lastName}</td><td>${u.email}</td>
        <td><span class="badge bg-${u.role==='ADMIN'?'danger':u.role==='OWNER'?'warning':'info'}">${u.role}</span></td>
        <td><span class="badge bg-${u.active?'success':'secondary'}">${u.active?'Aktif':'Pasif'}</span></td>
        <td><button class="btn btn-sm btn-outline-primary me-1" onclick="toggleStatus(${u.id})"><i class="bi bi-toggle-on"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})"><i class="bi bi-trash"></i></button></td></tr>
    `).join('');
}
async function toggleStatus(id) {
    const token = localStorage.getItem('accessToken');
    await fetch(`/api/admin/users/${id}/toggle-status`, {method:'PUT',headers:{'Authorization':'Bearer '+token}});
    loadUsers();
}
async function deleteUser(id) {
    if (!confirm('Kullanıcıyı silmek istediğinize emin misiniz?')) return;
    const token = localStorage.getItem('accessToken');
    await fetch(`/api/admin/users/${id}`, {method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    loadUsers();
}
document.getElementById('userSearch').addEventListener('keypress', e => { if(e.key==='Enter') loadUsers(); });
document.getElementById('userRole').addEventListener('change', loadUsers);
loadUsers();
</script>
</body>
</html>
