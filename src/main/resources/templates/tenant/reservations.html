<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Rezervasyonlarım</title></head>
<body><main layout:fragment="content">
    <div class="container py-4"><h3 class="mb-4">Rezervasyonlarım</h3>
        <div id="resList"></div>
        <div id="emptyRes" class="empty-state d-none text-center py-5"><i class="bi bi-calendar-x" style="font-size:4rem;color:#aaa"></i><h4 class="mt-3">Henüz rezervasyonunuz yok</h4><a href="/tinyhouses" class="btn btn-primary mt-2">Tiny House Keşfet</a></div>
    </div>

<div class="modal fade" id="paymentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="bi bi-credit-card me-2"></i>Güvenli Ödeme</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="paymentForm">
            <input type="hidden" id="payReservationId">
            <div class="mb-3">
                <label class="form-label">Kart Üzerindeki İsim</label>
                <input type="text" class="form-control" id="payCardHolder" value="Mehmet Kiracı" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Kart Numarası</label>
                <input type="text" class="form-control" id="payCardNumber" placeholder="xxxx-xxxx-xxxx-xxxx" value="4532 1234 5678 9012" required>
                <div class="form-text">Test için sonu 0000 bitmeyen rastgele bir kart girebilirsiniz (0000 = Hata).</div>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Son Kullanma (AA/YY)</label>
                    <input type="text" class="form-control" id="payExpiry" placeholder="12/26" value="12/28" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">CVV</label>
                    <input type="text" class="form-control" id="payCvv" placeholder="123" value="123" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 btn-lg mt-3" id="paySubmitBtn">Ödemeyi Tamamla</button>
        </form>
      </div>
    </div>
  </div>
</div>
</main>
<script layout:fragment="scripts">
async function load() {
    try {
        const t = localStorage.getItem('accessToken');
        const r = await fetch('/api/reservations/my?size=20&sort=createdAt,desc', {
            headers: {'Authorization': 'Bearer ' + t}
        });
        
        if (r.status === 401) {
            localStorage.removeItem('accessToken');
            window.location.href = '/login';
            return;
        }

        const d = await r.json();
        
        if (!d.success || !d.data || !d.data.content || d.data.content.length === 0) {
            document.getElementById('emptyRes').classList.remove('d-none');
            document.getElementById('resList').innerHTML = '';
            return;
        }
        
        document.getElementById('emptyRes').classList.add('d-none');
        
        const sc = {PENDING:'warning', CONFIRMED:'primary', COMPLETED:'success', CANCELLED:'secondary', REJECTED:'danger'};
        
        const html = d.data.content.map(r => {
            let paymentBadge = r.paymentStatus === 'COMPLETED' 
                ? `<span class="badge bg-success mb-2"><i class="bi bi-check-circle"></i> Ödendi</span><br>` 
                : '';
            
            let cancelBtn = (r.reservationStatus === 'PENDING' || r.reservationStatus === 'CONFIRMED') 
                ? `<button class="btn btn-sm btn-outline-danger" onclick="cancel(${r.id})"><i class="bi bi-x-circle"></i> İptal</button>` 
                : '';
            
            let payBtn = (r.reservationStatus === 'CONFIRMED' && r.paymentStatus === 'PENDING') 
                ? `<a href="javascript:void(0)" class="btn btn-sm btn-success ms-1" onclick="pay(${r.id})"><i class="bi bi-credit-card"></i> Öde</a>` 
                : '';

            return `
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <img src="${r.tinyHouseCoverImage || '/images/placeholder.jpg'}" class="img-fluid rounded" alt="">
                        </div>
                        <div class="col-md-4">
                            <h5>${r.tinyHouseTitle || 'Ev'}</h5>
                            <p class="text-muted mb-0"><i class="bi bi-geo-alt"></i> ${r.tinyHouseCity || ''}</p>
                        </div>
                        <div class="col-md-3">
                            <p class="mb-1"><i class="bi bi-calendar"></i> ${r.startDate} - ${r.endDate}</p>
                            <p class="mb-0"><strong>${r.totalPrice} ₺</strong> (${r.totalDays} gece)</p>
                        </div>
                        <div class="col-md-3 text-end">
                            <span class="badge bg-${sc[r.reservationStatus] || 'secondary'} mb-2">${r.reservationStatus}</span><br>
                            ${paymentBadge}
                            ${cancelBtn} 
                            ${payBtn}
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
        
        document.getElementById('resList').innerHTML = html;
        
    } catch (err) {
        console.error("Load error:", err);
        showToast("Bir hata oluştu: " + err.message, "danger");
    }
}

async function cancel(id) {
    if(!confirm('İptal etmek istediğinize emin misiniz?')) return;
    try {
        await fetch(`/api/reservations/${id}/cancel`, {
            method: 'PUT',
            headers: {'Authorization': 'Bearer ' + localStorage.getItem('accessToken')}
        });
        load();
    } catch(err) {
        console.error(err);
    }
}

let pModal = null;
function pay(id) {
    document.getElementById('payReservationId').value = id;
    if(!pModal) pModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    pModal.show();
}

document.addEventListener('DOMContentLoaded', function() {
    const paymentForm = document.getElementById('paymentForm');
    if(paymentForm) {
        paymentForm.addEventListener('submit', async function(e){
            e.preventDefault();
            const btn = document.getElementById('paySubmitBtn'); 
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> İşleniyor...'; 
            btn.disabled = true;
            
            const body = {
                reservationId: document.getElementById('payReservationId').value,
                paymentMethod: 'CREDIT_CARD',
                cardNumber: document.getElementById('payCardNumber').value,
                cardHolder: document.getElementById('payCardHolder').value,
                expiryDate: document.getElementById('payExpiry').value,
                cvv: document.getElementById('payCvv').value
            };
            
            try {
                const res = await fetch('/api/payments', { 
                    method: 'POST', 
                    headers: {
                        'Content-Type': 'application/json', 
                        'Authorization': 'Bearer ' + localStorage.getItem('accessToken')
                    }, 
                    body: JSON.stringify(body) 
                });
                const data = await res.json();
                if(data.success) {
                    showToast('Ödeme başarıyla alındı!', 'success');
                    pModal.hide();
                    load();
                } else {
                    showToast(data.message || 'Ödeme reddedildi!', 'danger');
                }
            } catch (err) {
                showToast("Ödeme işlenirken hata: " + err.message, "danger");
            } finally {
                btn.innerHTML = 'Ödemeyi Tamamla'; 
                btn.disabled = false;
            }
        });
    }
    
    load();
});
</script></body></html>
