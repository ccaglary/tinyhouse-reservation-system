<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Favorilerim</title></head>
<body><main layout:fragment="content">
    <div class="container py-4"><h3 class="mb-4"><i class="bi bi-heart-fill text-danger"></i> Favorilerim</h3>
        <div class="row g-4" id="favGrid"></div>
        <div id="emptyFav" class="empty-state d-none text-center py-5"><i class="bi bi-heart" style="font-size:4rem;color:#aaa"></i><h4 class="mt-3">Henüz favoriniz yok</h4><a href="/tinyhouses" class="btn btn-primary mt-2">Tiny House Keşfet</a></div>
    </div>
</main>
<script layout:fragment="scripts">
async function load(){const t=localStorage.getItem('accessToken');const r=await fetch('/api/favorites?size=20',{headers:{'Authorization':'Bearer '+t}});const d=await r.json();
if(!d.success||!d.data.content.length){document.getElementById('emptyFav').classList.remove('d-none');return;}
document.getElementById('favGrid').innerHTML=d.data.content.map(h=>`<div class="col-md-6 col-lg-4"><div class="house-card" onclick="location.href='/tinyhouses/${h.id}'"><div class="house-card-img"><img src="${h.coverImageUrl||'/images/placeholder.jpg'}" alt="${h.title}"></div><div class="house-card-body"><h5 class="house-card-title">${h.title}</h5><p class="house-card-location"><i class="bi bi-geo-alt"></i> ${h.city}</p><div class="house-card-price"><span class="price">${h.nightlyPrice} ₺</span><span class="price-unit"> / gece</span></div></div></div></div>`).join('');}
load();
</script></body></html>
