<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Giriş Yap</title></head>
<body>
<main layout:fragment="content">
    <section class="auth-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="auth-card">
                        <div class="text-center mb-4">
                            <h2 class="auth-title"><i class="bi bi-house-heart-fill text-primary"></i></h2>
                            <h3>Giriş Yap</h3>
                            <p class="text-muted">Hesabınıza giriş yapın</p>
                        </div>
                        <div class="alert alert-danger d-none" id="loginError"></div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">E-posta</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="ornek@email.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Şifre</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Beni hatırla</label>
                                </div>
                                <a th:href="@{/forgot-password}" class="text-primary small">Şifremi unuttum</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                <i class="bi bi-box-arrow-in-right"></i> Giriş Yap
                            </button>
                        </form>
                        <hr>
                        <p class="text-center mb-0">
                            Hesabınız yok mu? <a th:href="@{/register}" class="text-primary fw-bold">Kayıt Ol</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<script layout:fragment="scripts">
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorEl = document.getElementById('loginError');
    errorEl.classList.add('d-none');

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value,
                rememberMe: document.getElementById('rememberMe').checked
            })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('accessToken', data.data.accessToken);
            localStorage.setItem('refreshToken', data.data.refreshToken);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            document.cookie = `accessToken=${data.data.accessToken}; path=/; max-age=${data.data.expiresIn / 1000}`;
            const role = data.data.user.role;
            if (role === 'ADMIN') window.location.href = '/admin/dashboard';
            else if (role === 'OWNER') window.location.href = '/owner/dashboard';
            else window.location.href = '/';
        } else {
            errorEl.textContent = data.message;
            errorEl.classList.remove('d-none');
        }
    } catch (err) {
        errorEl.textContent = 'Bir hata oluştu. Lütfen tekrar deneyin.';
        errorEl.classList.remove('d-none');
    }
});
</script>
</body>
</html>
